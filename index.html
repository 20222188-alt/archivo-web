
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conexión interrumpida</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #020303;
  color: #6cff9d;
  font: 13px/1.5 monospace;
  overflow: hidden;
}

main {
  padding: 20px 16px;
  max-width: 750px;
  margin: auto;
}

.header {
  color: #ff3434;
  font-weight: bold;
  letter-spacing: 2px;
  padding-bottom: 12px;
  border-bottom: 1px solid #622;
}

h1 {
  color: #ff3434;
  font-size: clamp(28px, 8vw, 52px);
  line-height: 1.1;
  margin: 28px 0 10px;
  text-shadow: 0 0 18px #ff000077;
}

.subtitle {
  color: #a0a0a0;
  margin-bottom: 22px;
}

#log {
  height: 38vh;
  overflow: hidden;
  overflow-wrap: anywhere;
}

#log div {
  margin-bottom: 4px;
}

.danger {
  color: #ff4444;
  font-weight: bold;
}

.progress {
  height: 8px;
  background: #301717;
  margin-top: 18px;
}

#bar {
  height: 100%;
  width: 0;
  background: #ff3434;
  box-shadow: 0 0 18px red;
  transition: width .2s;
}

#timer {
  color: #ff3434;
  font-size: clamp(50px, 15vw, 90px);
  font-weight: bold;
  text-align: center;
  margin-top: 15px;
}

.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 3px,
    #ffffff09 4px,
    #ffffff09 5px
  );
}

.glitch {
  animation: glitch .12s 3;
}

@keyframes glitch {
  0% { transform: translateX(0); }
  25% { transform: translateX(8px); filter: contrast(2); }
  50% { transform: translateX(-8px); filter: hue-rotate(90deg); }
  75% { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

#overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #000;
  color: #ff3434;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}

#overlay h2 {
  font-size: clamp(26px, 8vw, 50px);
  text-shadow: 0 0 20px #ff000077;
}

#overlay p {
  color: #aaa;
}

#final {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 25;
  background: #000;
  color: #ff3434;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  font-size: clamp(28px, 9vw, 60px);
  font-weight: bold;
}

.notice {
  position: fixed;
  bottom: 10px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #888;
  font-size: 10px;
  z-index: 30;
}
</style>
</head>

<body>

<div class="scanlines"></div>

<main id="main">
  <div class="header">
    SECURITY EVENT // 0x7F
  </div>

  <h1 id="headline">ANOMALÍA DETECTADA</h1>

  <div class="subtitle" id="subtitle">
    Monitorizando actividad de conexión...
  </div>

  <div id="log"></div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div id="timer">00:15</div>
</main>

<div id="overlay">
  <h2>DISPOSITIVO SIN RESPUESTA</h2>
  <p>Comprobando estado de conexión...</p>
</div>

<div id="final">
  CONEXIÓN PERDIDA
</div>

<div class="notice">
  RECREACIÓN DE CIBERSEGURIDAD
</div>

<script>
const lines = [
  "Inicializando diagnóstico...",
  "Comprobando integridad de conexión...",
  "ALERTA: actividad inusual",
  "Analizando canales...",
  "ERROR: respuesta inesperada",
  "Verificando sesión...",
  "ADVERTENCIA: conexión inestable",
  "Ejecutando comprobación...",
  "ERROR: sincronización interrumpida",
  "Analizando registros...",
  "ALERTA: evento desconocido",
  "Verificando servidor...",
  "ERROR: tiempo de respuesta agotado",
  "Intentando recuperación...",
  "ADVERTENCIA: proceso incompleto",
  "Comprobando última conexión..."
];

const main = document.getElementById("main");
const log = document.getElementById("log");
const bar = document.getElementById("bar");
const timer = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const finalScreen = document.getElementById("final");

let elapsed = 0;
let index = 0;

function addLine() {
  const div = document.createElement("div");
  const message = lines[index % lines.length];

  div.textContent = "> [" +
    String(index).padStart(2, "0") +
    "] " + message;

  if (/ALERTA|ERROR|ADVERTENCIA/.test(message)) {
    div.className = "danger";
  }

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  index++;
}

function glitch() {
  main.classList.remove("glitch");
  void main.offsetWidth;
  main.classList.add("glitch");
}

addLine();

const writer = setInterval(() => {
  addLine();

  if (index % 5 === 0) {
    glitch();
  }
}, 350);

const clock = setInterval(() => {
  elapsed++;

  const remaining = Math.max(0, 15 - elapsed);

  timer.textContent =
    "00:" + String(remaining).padStart(2, "0");

  bar.style.width = (elapsed / 15 * 100) + "%";

  if (elapsed === 4) {
    document.getElementById("headline").textContent =
      "FALLO CRÍTICO";
    glitch();
  }

  if (elapsed === 7) {
    overlay.style.display = "flex";
  }

  if (elapsed === 11) {
    overlay.style.display = "none";
    main.style.display = "none";
    document.querySelector(".scanlines").style.display = "none";
  }

  if (elapsed === 15) {
    clearInterval(clock);
    clearInterval(writer);
    finalScreen.style.display = "flex";
  }
}, 1000);
</script>

</body>
</html>
