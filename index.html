<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conexión interrumpida</title><style>*{box-sizing:border-box}body{margin:0;background:#030405;color:#c7d3d0;font:13px/1.55 monospace;overflow:hidden}.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff08 4px 5px);z-index:4}.wrap{padding:22px 17px;max-width:750px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #452020;padding-bottom:12px;color:#f44;font-weight:bold;letter-spacing:2px}.tag{font-size:10px;color:#aaa;letter-spacing:0}.status{font-size:clamp(25px,7vw,48px);color:#fa3a3a;font-weight:900;line-height:1.1;margin:28px 0 8px;text-shadow:0 0 15px #f003}.sub{color:#8d9997;margin-bottom:20px}.log{height:38vh;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;color:#7ee6a2}.log div{margin:3px 0}.danger{color:#ff5555!important}.progress{height:7px;background:#25191b;margin-top:20px}.bar{height:100%;width:0;background:#ff3838;box-shadow:0 0 16px #f44;transition:width .3s}.count{font-size:clamp(44px,14vw,85px);font-weight:900;color:#ff3939;text-align:center;margin-top:15px;letter-spacing:4px}.footer{position:fixed;bottom:10px;left:0;width:100%;text-align:center;font-size:10px;color:#737a7a;z-index:6}.flash{animation:glitch .12s 2}@keyframes glitch{0%{transform:translateX(0);filter:none}30%{transform:translateX(5px);filter:hue-rotate(90deg)}60%{transform:translateX(-6px)}100%{transform:translateX(0)}}#end{display:none;position:fixed;inset:0;background:#000;align-items:center;justify-content:center;flex-direction:column;color:#f33;font-weight:900;font-size:clamp(28px,9vw,60px);letter-spacing:3px;text-align:center;padding:15px}#end small{font-size:12px;color:#777;margin-top:20px;font-weight:normal;letter-spacing:0}</style></head><body><div class="scan"></div><main class="wrap" id="main"><div class="top"><span>SECURITY EVENT // 0x7F</span><span class="tag">RECREACIÓN FICTICIA</span></div><div class="status" id="headline">ANOMALÍA DETECTADA</div><div class="sub" id="sub">Monitorizando actividad de conexión...</div><div class="log" id="log" aria-live="off"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="count" id="count">00:30</div></main><div id="end">CONEXIÓN PERDIDA<small>Escena ficticia · Ningún dato fue consultado ni transferido</small></div><div class="footer">ESCENA FICTICIA · Sin acceso al dispositivo ni a sus datos</div><script>const lines=['[00] Inicializando diagnóstico de red...','[01] Comprobando integridad de la sesión...','[02] ALERTA: patrón de tráfico inusual','[03] Analizando rutas de conexión...','[04] ERROR: respuesta inesperada del servidor','[05] Reintentando validación de seguridad...','[06] AVISO: anomalía persistente','[07] Verificando canales de comunicación...','[08] ADVERTENCIA: sincronización interrumpida','[09] Ejecutando protocolo de aislamiento...','[10] ERROR: tiempo de respuesta agotado','[11] Reiniciando comprobación de integridad...','[12] ALERTA: conexión inestable','[13] Procesando último intento de recuperación...'];let n=30,i=0;const log=document.getElementById('log'),bar=document.getElementById('bar'),count=document.getElementById('count');function add(){if(i>=lines.length)return;const d=document.createElement('div');d.textContent='> '+lines[i];if(/ALERTA|ERROR|ADVERTENCIA/.test(lines[i]))d.className='danger';log.appendChild(d);log.scrollTop=log.scrollHeight;i++;if(i%4===0){document.getElementById('main').classList.add('flash');setTimeout(()=>document.getElementById('main').classList.remove('flash'),260)}}add();const ticker=setInterval(()=>{n--;count.textContent='00:'+String(n).padStart(2,'0');bar.style.width=((30-n)/30*100)+'%';if(n===20){document.getElementById('headline').textContent='ACCESO ANÓMALO';document.getElementById('sub').textContent='Se detectaron eventos inesperados en la conexión.'}if(n===10){document.getElementById('headline').textContent='FALLO DE CONEXIÓN';document.getElementById('sub').textContent='No se pudo completar la verificación.'}if(n<=0){clearInterval(ticker);clearInterval(writer);document.getElementById('main').style.display='none';document.getElementById('end').style.display='flex'}},1000);const writer=setInterval(add,1750);</script></body></html>
